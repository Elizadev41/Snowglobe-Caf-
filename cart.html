<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View your Snowglobe Café order.">
  <title>Your cart | Snowglobe Café</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="cart-page">
  <header class="navbar">
    <a class="logo" href="index.html" aria-label="Snowglobe Café home">Snowglobe Café</a>
    <nav aria-label="Primary navigation">
      <a href="explore.html">Menu</a>
      <a href="build.html">Build a drink</a>
      <a class="active" href="cart.html">Cart</a>
    </nav>
    <a class="nav-button" href="explore.html">Add a drink</a>
  </header>

  <main>
    <section class="page-header cart-header" aria-labelledby="page-title">
      <p class="eyebrow">Your order</p>
      <h1 id="page-title">Your cart.</h1>
      <p>Here is what you picked.</p>
    </section>

    <section class="cart-page-panel" aria-live="polite">
      <ul id="full-cart-list" class="full-cart-list">
        <li class="empty-cart">Your cart is empty.</li>
      </ul>
      <div class="full-cart-total">
        <span>Total</span>
        <strong id="full-cart-total">$0.00</strong>
      </div>
      <form id="checkout-form" class="checkout-form">
        <h2>Pickup details</h2>
        <label for="customer-name">Name</label>
        <input id="customer-name" name="customerName" type="text" autocomplete="name" required>

        <label for="pickup-time">Pickup time</label>
        <select id="pickup-time" name="pickupTime" required>
          <option value="">Choose a time</option>
          <option>As soon as possible</option>
          <option>12:00 PM - 12:15 PM</option>
          <option>12:30 PM - 12:45 PM</option>
          <option>1:00 PM - 1:15 PM</option>
          <option>1:30 PM - 1:45 PM</option>
          <option>2:00 PM - 2:15 PM</option>
        </select>

        <fieldset>
          <legend>Payment method</legend>
          <label><input type="radio" name="paymentMethod" value="Card" required> Card at pickup</label>
          <label><input type="radio" name="paymentMethod" value="Cash"> Cash at pickup</label>
        </fieldset>

        <button id="checkout-button" class="primary-button cart-button" type="submit">Place order</button>
      </form>
      <p id="checkout-message" class="checkout-message"></p>
      <section id="confirmation-panel" class="confirmation-panel" hidden aria-live="polite">
        <p class="eyebrow">Order confirmed</p>
        <h2>See you soon.</h2>
        <p id="confirmation-details"></p>
        <ul id="confirmation-items"></ul>
        <div class="confirmation-total">
          <span>Total</span>
          <strong id="confirmation-total"></strong>
        </div>
      </section>
    </section>
  </main>

  <footer>
    <a class="footer-logo" href="index.html">Snowglobe Café</a>
    <p>For snowy days and late nights.</p>
    <p class="copyright">&copy; 2026 Snowglobe Café</p>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
